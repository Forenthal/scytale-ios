[package]
name = "scytale"
version = "1.0.0"
edition = "2021"
description = "Scytale: local AES-256 file vault and burn-after-reading message tool"

[dependencies]
aes-gcm = { version = "0.10", features = ["stream"] }
argon2 = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
miniz_oxide = "0.8"
unicode-width = "0.2"
quick-xml = "0.42"
# Courier (device-to-device messages): hybrid classical + post-quantum. Same versions as Scytale-iOS.
x25519-dalek = { version = "=3.0.0", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
ml-kem = { version = "=0.3.4", features = ["zeroize", "getrandom"] }
ml-dsa = { version = "=0.1.2", features = ["zeroize"] }

# WinRT: the PDF renderer built into Windows (Windows.Data.Pdf), fed from memory only.
[dependencies.windows]
version = "0.58"
features = ["Foundation", "Data_Pdf", "Storage_Streams", "Win32_System_WinRT"]

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ErrorReporting",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Threading",
]

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
overflow-checks = true

[profile.dev]
panic = "abort"
