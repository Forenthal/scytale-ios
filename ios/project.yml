# XcodeGen spec. The .xcodeproj is generated from this on the build Mac and never committed.
# No capabilities are enabled: no iCloud, no push, no App Groups, no associated domains.
name: Scytale
options:
  bundleIdPrefix: com.forenthal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Scytale:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - framework: ../build/ScytaleCore.xcframework
        embed: false
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_NAME: Scytale
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.forenthal.scytale
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scytale
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID unlocks Scytale's key in the Secure Enclave. It never leaves this iPhone."
        INFOPLIST_KEY_NSCameraUsageDescription: "Photos you take in Scytale are encrypted straight into the vault. They never reach Photos or iCloud."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Only used when you ask Scytale to delete the originals of photos it has encrypted."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.6.2"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [ScytaleTests]
  ScytaleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Scytale
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
