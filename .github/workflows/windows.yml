# Scytale for Windows: tests on a real Windows machine, from the public source.
# No binaries are published from this workflow.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Tests
        working-directory: windows
        run: cargo test --locked --release

      - name: Release build
        working-directory: windows
        run: cargo build --locked --release
