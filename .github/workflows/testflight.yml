# Signed build -> TestFlight. Manual trigger only: nothing ships unless it is started on purpose.
# Signing secrets are loaded only after every third-party tool (the pinned XcodeGen) has finished.
name: testflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select newest released Xcode
        run: bash scripts/select-xcode.sh

      - name: Toolchain versions
        run: |
          xcodebuild -version
          rustc --version

      - name: Rust iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Core tests (Mac host)
        working-directory: core
        run: cargo test --locked --release

      - name: Build core for iOS
        run: bash scripts/build-core.sh

      - name: Install XcodeGen (pinned, checksum-verified)
        run: bash scripts/install-xcodegen.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Unit tests on iPhone simulator
        run: bash scripts/test-sim.sh

      # ---- signing material from here on ----
      - name: Install signing certificate and profile
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -base64 32)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # Diagnostics (no secret values): sizes, and whether a second parser accepts the bundle.
          echo "p12 bytes: $(wc -c < "$RUNNER_TEMP/dist.p12")  sha256: $(shasum -a 256 "$RUNNER_TEMP/dist.p12" | cut -c1-16)  password length: ${#DIST_CERT_PASSWORD}"
          if /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:DIST_CERT_PASSWORD -noout 2>/dev/null; then
            echo "openssl: password accepted"
          else
            echo "openssl: password or format rejected"
          fi
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | grep -c "Apple Distribution" > /dev/null

          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          echo "profile $UUID installed"

      - name: Archive (signed)
        run: |
          set -euo pipefail
          cd ios
          xcodebuild archive \
            -project Scytale.xcodeproj \
            -scheme Scytale \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Scytale.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=RWX6R62WK4 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Scytale Forenthal" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Check signed entitlements (no iCloud / push)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Scytale.xcarchive/Products/Applications/Scytale.app"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/ent.plist"
          plutil -p "$RUNNER_TEMP/ent.plist"
          if grep -E -q "icloud|ubiquity|aps-environment|application-groups" "$RUNNER_TEMP/ent.plist"; then
            echo "forbidden entitlement present" >&2; exit 1
          fi

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Scytale.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" \
                 "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
